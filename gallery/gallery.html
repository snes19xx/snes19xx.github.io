<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture Archive</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ink: #141414;
        --fog: #e8e4df;
        --paper: #f4f1ed;
        --ghost: #c8c2ba;
        --accent: #a7c080;
        --mono: "JetBrains Mono", monospace;
        --serif: "Cormorant Garamond", Georgia, serif;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Back navigation ── */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 40px;
        background: var(--paper);
        border-bottom: 1px solid var(--fog);
      }

      .nav__back {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--ghost);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: color 0.25s ease;
      }

      .nav__back:hover {
        color: var(--ink);
      }

      .nav__back-arrow {
        display: block;
        width: 24px;
        height: 1px;
        background: currentColor;
        position: relative;
        transition: width 0.25s ease;
      }

      .nav__back:hover .nav__back-arrow {
        width: 32px;
      }

      .nav__back-arrow::before {
        content: "";
        position: absolute;
        left: 0;
        top: -3px;
        width: 6px;
        height: 6px;
        border-left: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: rotate(45deg);
      }

      .nav__title {
        font-family: var(--serif);
        font-size: 14px;
        font-weight: 300;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .nav__counter {
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--ghost);
      }

      /* ── Page header ── */
      .header {
        padding: 120px 40px 60px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        border-bottom: 1px solid var(--fog);
        margin-bottom: 60px;
      }

      .header__left h1 {
        font-family: var(--serif);
        font-size: clamp(52px, 8vw, 96px);
        font-weight: 300;
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .header__left h1 em {
        font-style: italic;
        color: var(--ghost);
      }

      .header__meta {
        text-align: right;
        color: var(--ghost);
        font-size: 10px;
        line-height: 2;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ── Grid ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 0 40px 100px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
          padding: 0 16px 60px;
        }
        .header {
          padding: 100px 20px 40px;
        }
        .nav {
          padding: 18px 20px;
        }
      }

      .grid__cell {
        position: relative;
        aspect-ratio: 3/4;
        overflow: hidden;
        cursor: pointer;
        background: var(--fog);
      }

      /* Fujifilm-style warm grayscale */
      .grid__cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition:
          transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          filter 0.5s ease;
        filter: grayscale(1) sepia(0.18) contrast(1.08) brightness(0.97)
          saturate(0.9);
        transform-origin: center center;
      }

      .grid__cell:hover img {
        transform: scale(1.04);
        filter: grayscale(1) sepia(0.25) contrast(1.12) brightness(0.92)
          saturate(0.9);
      }

      /* Shadow card effect */
      .grid__cell::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
        pointer-events: none;
        z-index: 2;
      }

      /* Hover overlay with number */
      .grid__cell__overlay {
        position: absolute;
        inset: 0;
        background: rgba(20, 20, 20, 0);
        display: flex;
        align-items: flex-end;
        padding: 16px;
        z-index: 3;
        transition: background 0.4s ease;
      }

      .grid__cell:hover .grid__cell__overlay {
        background: rgba(20, 20, 20, 0.12);
      }

      .grid__cell__num {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0);
        transition: color 0.3s ease;
        text-transform: uppercase;
      }

      .grid__cell:hover .grid__cell__num {
        color: rgba(255, 255, 255, 0.7);
      }

      /* ── Lightbox ── */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      .lightbox.active {
        opacity: 1;
        visibility: visible;
      }

      .lightbox__backdrop {
        position: absolute;
        inset: 0;
        background: rgba(20, 18, 16, 0.94);
        cursor: pointer;
      }

      .lightbox__stage {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 60px;
      }

      .lightbox__img-wrap {
        position: relative;
        max-width: min(86vw, 1100px);
        max-height: 86vh;
        transition:
          transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          opacity 0.3s ease;
      }

      .lightbox__img-wrap.slide-left {
        animation: slideLeft 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      .lightbox__img-wrap.slide-right {
        animation: slideRight 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
      }

      @keyframes slideLeft {
        0% {
          opacity: 1;
          transform: translateX(0);
        }
        49% {
          opacity: 0;
          transform: translateX(-60px);
        }
        50% {
          opacity: 0;
          transform: translateX(60px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideRight {
        0% {
          opacity: 1;
          transform: translateX(0);
        }
        49% {
          opacity: 0;
          transform: translateX(60px);
        }
        50% {
          opacity: 0;
          transform: translateX(-60px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .lightbox__img {
        display: block;
        max-width: 100%;
        max-height: 80vh;
        object-fit: contain;
        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.6),
          0 8px 20px rgba(0, 0, 0, 0.3);
        /* Full color in lightbox */
        filter: none;
      }

      /* Controls */
      .lightbox__btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.35);
        z-index: 20;
        padding: 20px;
        transition: color 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .lightbox__btn:hover {
        color: rgba(255, 255, 255, 0.9);
      }

      .lightbox__btn--prev {
        left: 24px;
      }
      .lightbox__btn--next {
        right: 24px;
      }

      .lightbox__btn-line {
        display: block;
        width: 32px;
        height: 1px;
        background: currentColor;
        position: relative;
        transition: width 0.2s ease;
        flex-shrink: 0;
      }

      .lightbox__btn:hover .lightbox__btn-line {
        width: 48px;
      }

      .lightbox__btn--prev .lightbox__btn-line::before,
      .lightbox__btn--next .lightbox__btn-line::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        border: 1px solid currentColor;
      }

      .lightbox__btn--prev .lightbox__btn-line::before {
        left: 0;
        top: -4px;
        border-right: none;
        border-top: none;
        transform: rotate(45deg);
      }

      .lightbox__btn--next .lightbox__btn-line::after {
        right: 0;
        top: -4px;
        border-left: none;
        border-bottom: none;
        transform: rotate(45deg);
      }

      .lightbox__close {
        position: absolute;
        top: 28px;
        right: 36px;
        background: none;
        border: none;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.35);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: color 0.2s ease;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .lightbox__close:hover {
        color: rgba(255, 255, 255, 0.9);
      }

      .lightbox__close-x {
        display: block;
        width: 18px;
        height: 18px;
        position: relative;
      }

      .lightbox__close-x::before,
      .lightbox__close-x::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 1px;
        background: currentColor;
      }

      .lightbox__close-x::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }
      .lightbox__close-x::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      /* Caption bar */
      .lightbox__caption {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        white-space: nowrap;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .lightbox__caption-current {
        color: rgba(255, 255, 255, 0.7);
      }

      .lightbox__caption-dots {
        display: flex;
        gap: 5px;
      }

      .lightbox__dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .lightbox__dot.active {
        background: rgba(255, 255, 255, 0.75);
        transform: scale(1.4);
      }

      /* ── Scroll hint ── */
      .scroll-hint {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ghost);
        animation: fadeScroll 3s ease 1.5s both;
        pointer-events: none;
      }

      @keyframes fadeScroll {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /* ── Entrance animation ── */
      .grid__cell {
        opacity: 0;
        transform: translateY(16px);
        animation: cellIn 0.5s ease forwards;
      }

      .grid__cell:nth-child(1) {
        animation-delay: 0.05s;
      }
      .grid__cell:nth-child(2) {
        animation-delay: 0.1s;
      }
      .grid__cell:nth-child(3) {
        animation-delay: 0.15s;
      }
      .grid__cell:nth-child(4) {
        animation-delay: 0.2s;
      }
      .grid__cell:nth-child(5) {
        animation-delay: 0.25s;
      }
      .grid__cell:nth-child(6) {
        animation-delay: 0.3s;
      }
      .grid__cell:nth-child(7) {
        animation-delay: 0.35s;
      }
      .grid__cell:nth-child(8) {
        animation-delay: 0.4s;
      }
      .grid__cell:nth-child(9) {
        animation-delay: 0.45s;
      }
      .grid__cell:nth-child(10) {
        animation-delay: 0.5s;
      }

      @keyframes cellIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header__left h1 {
        opacity: 0;
        animation: headIn 0.8s ease 0.1s forwards;
      }

      @keyframes headIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="nav">
      <a href="../index.html" class="nav__back">
        <span class="nav__back-arrow"></span>
        <span>Portfolio</span>
      </a>
      <span class="nav__title"></span>
      <span class="nav__counter" id="nav-counter">01 — 10</span>
    </nav>

    <!-- Header -->
    <header class="header">
      <div class="header__left">
        <h1>Field<br /><em>Notes</em></h1>
      </div>
    </header>

    <!-- Grid -->
    <div class="grid" id="gallery-grid"></div>

    <!-- Lightbox -->
    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image viewer"
    >
      <div class="lightbox__backdrop" id="lb-backdrop"></div>

      <button class="lightbox__close" id="lb-close" aria-label="Close">
        <span class="lightbox__close-x"></span>
        <span>Close</span>
      </button>

      <div class="lightbox__stage">
        <button
          class="lightbox__btn lightbox__btn--prev"
          id="lb-prev"
          aria-label="Previous"
        >
          <span class="lightbox__btn-line"></span>
          <span>Prev</span>
        </button>

        <div class="lightbox__img-wrap" id="lb-img-wrap">
          <img class="lightbox__img" id="lb-img" src="" alt="" />
        </div>

        <button
          class="lightbox__btn lightbox__btn--next"
          id="lb-next"
          aria-label="Next"
        >
          <span>Next</span>
          <span class="lightbox__btn-line"></span>
        </button>
      </div>

      <div class="lightbox__caption">
        <span class="lightbox__caption-current" id="lb-counter">01 / 10</span>
        <div class="lightbox__caption-dots" id="lb-dots"></div>
      </div>
    </div>

    <div class="scroll-hint">Scroll to explore</div>

    <script>
      const TOTAL = 26;
      const images = Array.from({ length: TOTAL }, (_, i) => ({
        src: `${i + 1}.jpg`,
        index: i,
      }));

      let current = 0;

      // Build grid
      const grid = document.getElementById("gallery-grid");
      images.forEach((img, i) => {
        const cell = document.createElement("div");
        cell.className = "grid__cell";
        cell.innerHTML = `
        <img src="${img.src}" alt=" ${i + 1}" loading="${i < 4 ? "eager" : "lazy"}" />
        <div class="grid__cell__overlay">
          <span class="grid__cell__num">${String(i + 1).padStart(2, "0")}</span>
        </div>
      `;
        cell.addEventListener("click", () => openLightbox(i));
        grid.appendChild(cell);
      });

      // Build dots
      const dotsEl = document.getElementById("lb-dots");
      images.forEach((_, i) => {
        const dot = document.createElement("span");
        dot.className = "lightbox__dot" + (i === 0 ? " active" : "");
        dot.addEventListener("click", () => goTo(i));
        dotsEl.appendChild(dot);
      });

      // Update counter
      document.getElementById("nav-counter").textContent =
        `01 — ${String(TOTAL).padStart(2, "0")}`;

      function openLightbox(idx) {
        current = idx;
        updateLightbox();
        document.getElementById("lightbox").classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("active");
        document.body.style.overflow = "";
      }

      function updateLightbox(direction) {
        const wrap = document.getElementById("lb-img-wrap");
        const img = document.getElementById("lb-img");
        const counter = document.getElementById("lb-counter");

        if (direction) {
          wrap.classList.remove("slide-left", "slide-right");
          void wrap.offsetWidth;
          wrap.classList.add(
            direction === "next" ? "slide-left" : "slide-right",
          );
        }

        img.src = images[current].src;
        img.alt = ` ${current + 1}`;
        counter.textContent = `${String(current + 1).padStart(2, "0")} / ${String(TOTAL).padStart(2, "0")}`;

        document.querySelectorAll(".lightbox__dot").forEach((dot, i) => {
          dot.classList.toggle("active", i === current);
        });
      }

      function goTo(idx, direction) {
        const dir = direction || (idx > current ? "next" : "prev");
        current = (idx + TOTAL) % TOTAL;
        updateLightbox(dir);
      }

      document
        .getElementById("lb-prev")
        .addEventListener("click", () => goTo(current - 1, "prev"));
      document
        .getElementById("lb-next")
        .addEventListener("click", () => goTo(current + 1, "next"));
      document
        .getElementById("lb-close")
        .addEventListener("click", closeLightbox);
      document
        .getElementById("lb-backdrop")
        .addEventListener("click", closeLightbox);

      document.addEventListener("keydown", (e) => {
        const lb = document.getElementById("lightbox");
        if (!lb.classList.contains("active")) return;
        if (e.key === "ArrowLeft") goTo(current - 1, "prev");
        if (e.key === "ArrowRight") goTo(current + 1, "next");
        if (e.key === "Escape") closeLightbox();
      });

      // Touch swipe support
      let touchStartX = 0;
      document.getElementById("lightbox").addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.touches[0].clientX;
        },
        { passive: true },
      );
      document.getElementById("lightbox").addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(dx) > 50) {
            dx < 0 ? goTo(current + 1, "next") : goTo(current - 1, "prev");
          }
        },
        { passive: true },
      );
    </script>
  </body>
</html>
