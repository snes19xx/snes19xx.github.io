<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maps - Sandesh Bhandari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --cream: #fdfbf7;
        --ink: #1c1710;
        --ink-mid: #4a4235;
        --ink-light: #8a7d6b;
        --ink-faint: #c8bfaa;
        --ink-ghost: #e2dbd0;
        --gap: 4px;
        --cols: 6;
        --max-w: 1400px;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        padding-top: 50px;
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        z-index: 200;
        background: rgba(253, 251, 247, 0.96);
        border-bottom: 1px solid var(--ink-ghost);
      }
      .back-link {
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-light);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
        z-index: 2;
      }
      .back-link svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        transition: transform 0.2s;
      }
      .back-link:hover {
        color: var(--ink);
      }
      .back-link:hover svg {
        transform: translateX(-3px);
      }
      .wordmark {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--ink);
        z-index: 1;
      }

      .section-nav {
        position: sticky;
        top: 54px;
        z-index: 100;
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 12px 40px;
        background: rgba(253, 251, 247, 0.96);
        border-bottom: 1px solid var(--ink-ghost);
      }
      .section-nav a {
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ink-faint);
        text-decoration: none;
        transition: color 0.2s;
      }
      .section-nav a:hover {
        color: var(--ink-mid);
      }

      .map-section {
        padding: 32px 100px 10px;
        border-bottom: 1px solid var(--ink-ghost);
        scroll-margin-top: 110px;
        content-visibility: auto;
        contain-intrinsic-size: 0 600px;
      }
      #interactive {
        content-visibility: visible;
      }
      .map-section:last-child {
        border-bottom: none;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 12px;
        margin: 0 auto 24px;
        max-width: var(--max-w);
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .section-head.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .section-title {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .section-count {
        font-size: 0.7rem;
        color: var(--ink-light);
      }

      .gallery-grid {
        display: flex;
        gap: var(--gap);
        max-width: var(--max-w);
        margin: 0 auto;
        align-items: flex-start;
      }
      .masonry-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .gallery-item {
        display: block;
        cursor: pointer;
        position: relative;
        opacity: 0;
        transform: translateY(12px);
        border: 1px solid var(--ink-ghost);
        box-shadow: 0 4px 16px rgba(28, 23, 16, 0.04);
        border-radius: 4px;
        padding: 4px;
        background: #fff;
        transition:
          opacity 0.6s ease,
          transform 0.4s ease,
          box-shadow 0.35s ease;
        overflow: hidden;
      }
      .gallery-item.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .gallery-item:hover {
        box-shadow: 0 12px 32px rgba(28, 23, 16, 0.08);
        transform: translateY(-4px);
      }

      .gallery-item::before {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          var(--ink-ghost) 0%,
          #ede7db 50%,
          var(--ink-ghost) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        z-index: 0;
      }
      .gallery-item.loaded::before {
        display: none;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .img-wrap {
        position: relative;
        display: block;
        width: 100%;
        z-index: 1;
        border-radius: 2px;
        overflow: hidden;
      }

      .img-wrap canvas {
        display: block;
        width: 100%;
        height: auto;
        filter: blur(4px) saturate(0.85);
        transform: scale(1.05);
        transition: opacity 0.5s ease;
      }
      .img-wrap img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.55s ease;
      }
      .img-wrap img.revealed {
        opacity: 1;
      }
      .img-wrap canvas.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .gallery-item:hover .img-wrap img {
        filter: brightness(0.97);
      }

      .int-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        max-width: var(--max-w);
        margin: 0 auto;
      }
      .int-preview {
        height: 200px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        background: #fff;
        border: 1px solid var(--ink-ghost);
        box-shadow: 0 4px 16px rgba(28, 23, 16, 0.04);
        border-radius: 6px;
        padding: 4px;
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 0.7s ease,
          transform 0.4s ease,
          box-shadow 0.4s ease;
      }
      .int-preview.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .int-preview:hover {
        box-shadow: 0 12px 32px rgba(28, 23, 16, 0.08);
        transform: translateY(-4px);
      }
      .int-preview iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 2px;
        pointer-events: none;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(253, 251, 247, 0.98);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .lightbox.open {
        opacity: 1;
        pointer-events: all;
      }
      .lb-inner {
        max-width: 90vw;
        max-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s ease;
      }
      .lb-inner img {
        max-width: 88vw;
        max-height: 87vh;
        object-fit: contain;
        display: block;
      }
      .lb-inner iframe {
        width: 88vw;
        height: 84vh;
        border: none;
        background: #fff;
        box-shadow: 0 4px 40px rgba(28, 23, 16, 0.1);
      }
      .lb-close {
        position: fixed;
        top: 22px;
        right: 36px;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-light);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: color 0.2s;
        z-index: 3001;
      }
      .lb-close svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }
      .lb-close:hover {
        color: var(--ink);
      }
      .lb-nav {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: 300;
        color: var(--ink-faint);
        cursor: pointer;
        padding: 20px 24px;
        transition: color 0.2s;
        z-index: 3001;
        line-height: 1;
      }
      .lb-nav:hover {
        color: var(--ink-mid);
      }
      .lb-nav:disabled {
        opacity: 0.15;
        cursor: default;
      }
      .lb-nav.prev {
        left: 4px;
      }
      .lb-nav.next {
        right: 4px;
      }
      .lb-counter {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.64rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
      }

      @media (max-width: 1100px) {
        :root {
          --cols: 5;
        }
      }
      @media (max-width: 800px) {
        :root {
          --cols: 4;
          --gap: 4px;
        }
        .int-preview {
          height: 150px;
        }
        .map-section {
          padding: 24px 24px 12px;
          scroll-margin-top: 100px;
        }
        .topbar,
        .section-nav {
          padding-left: 24px;
          padding-right: 24px;
        }
        .section-nav {
          gap: 20px;
          top: 54px;
        }
      }
      @media (max-width: 500px) {
        :root {
          --cols: 2;
        }
        .section-nav {
          flex-wrap: wrap;
          gap: 12px;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
        Portfolio
      </a>
      <a href="#" class="wordmark">Maps</a>
    </div>

    <nav class="section-nav">
      <a href="#interactive">Interactive</a>
      <a href="#main">Main</a>
      <a href="#stylized">Stylized</a>
      <a href="#class">Course Work</a>
    </nav>

    <section class="map-section" id="interactive">
      <div class="section-head">
        <span class="section-title">Interactive</span>
        <span class="section-count">3 maps</span>
      </div>
      <div class="int-grid">
        <div
          class="int-preview"
          id="intPreview1"
          data-src="interactive_1.html"
          role="button"
          tabindex="0"
          aria-label="Open interactive map 1"
        >
          <iframe scrolling="no" tabindex="-1"></iframe>
        </div>
        <div
          class="int-preview"
          id="intPreview2"
          data-src="interactive_2.html"
          role="button"
          tabindex="0"
          aria-label="Open interactive map 2"
        >
          <iframe scrolling="no" tabindex="-1"></iframe>
        </div>
        <div
          class="int-preview"
          id="intPreview3"
          data-src="ringsofsaturn/index.html"
          role="button"
          tabindex="0"
          aria-label="Open interactive map 3"
        >
          <iframe scrolling="no" tabindex="-1"></iframe>
        </div>
      </div>
    </section>

    <section class="map-section" id="main">
      <div class="section-head">
        <span class="section-title">Main</span
        ><span class="section-count" id="count-main">Loading...</span>
      </div>
      <div class="gallery-grid" id="main-masonry"></div>
    </section>

    <section class="map-section" id="stylized">
      <div class="section-head">
        <span class="section-title">Stylized</span
        ><span class="section-count" id="count-stylized">Loading...</span>
      </div>
      <div class="gallery-grid" id="stylized-masonry"></div>
    </section>

    <section class="map-section" id="class">
      <div class="section-head">
        <span class="section-title">Course Work</span
        ><span class="section-count" id="count-class">Loading...</span>
      </div>
      <div class="gallery-grid" id="class-masonry"></div>
    </section>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
      <button class="lb-close" id="lbClose">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Close
      </button>
      <button class="lb-nav prev" id="lbPrev">←</button>
      <div class="lb-inner" id="lbInner"></div>
      <button class="lb-nav next" id="lbNext">→</button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
