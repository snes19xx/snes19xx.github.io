<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maps — Sandesh Bhandari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --cream: #fdfbf7;
        --ink: #1c1710;
        --ink-mid: #4a4235;
        --ink-light: #8a7d6b;
        --ink-faint: #c8bfaa;
        --ink-ghost: #e2dbd0;
        --gap: 10px;
        --cols: 4;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /*  TOPBAR  */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 200;
        background: rgba(253, 251, 247, 0.96);
        border-bottom: 1px solid var(--ink-ghost);
      }

      .wordmark {
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .back-link {
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-light);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
      }
      .back-link svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        transition: transform 0.2s;
      }
      .back-link:hover {
        color: var(--ink);
      }
      .back-link:hover svg {
        transform: translateX(-3px);
      }

      /*  SECTION NAV  */
      .section-nav {
        position: sticky;
        top: 54px;
        z-index: 100;
        display: flex;
        gap: 32px;
        padding: 12px 40px;
        background: rgba(253, 251, 247, 0.96);
        border-bottom: 1px solid var(--ink-ghost);
      }
      .section-nav a {
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ink-faint);
        text-decoration: none;
        transition: color 0.2s;
      }
      .section-nav a:hover {
        color: var(--ink-mid);
      }

      /*  SECTIONS  */
      .map-section {
        padding: 56px 40px 80px;
        border-bottom: 1px solid var(--ink-ghost);
      }
      .map-section:last-child {
        border-bottom: none;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 28px;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .section-head.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .section-title {
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-mid);
      }
      .section-count {
        font-size: 0.68rem;
        font-weight: 300;
        color: var(--ink-faint);
      }

      /*  MASONRY  */
      .masonry-wrap {
        display: flex;
        gap: var(--gap);
        align-items: flex-start;
      }
      .masonry-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      .masonry-item {
        display: block;
        cursor: pointer;
        overflow: hidden;
        position: relative;
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .masonry-item.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .masonry-item img {
        display: block;
        width: 100%;
        height: auto;
        filter: brightness(0.98);
        transition:
          filter 0.4s ease,
          transform 0.4s ease;
      }
      .masonry-item:hover img {
        filter: brightness(1.01);
        transform: scale(1.01);
      }

      /*  INTERACTIVE  */
      .int-preview {
        overflow: hidden;
        cursor: pointer;
        position: relative;
        background: var(--ink-ghost);
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        margin-bottom: 18px;
      }
      .int-preview.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .int-preview iframe {
        display: block;
        width: 100%;
        height: 420px;
        border: none;
        pointer-events: none;
        transition: transform 0.4s ease;
      }
      .int-preview:hover iframe {
        transform: scale(1.006);
      }

      .int-caption {
        display: flex;
        align-items: baseline;
        gap: 24px;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.5s ease 0.1s,
          transform 0.5s ease 0.1s;
      }
      .int-caption.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .int-tag {
        font-size: 0.66rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
      }
      .int-body {
        font-size: 0.8rem;
        font-weight: 300;
        color: var(--ink-light);
        line-height: 1.6;
        flex: 1;
      }
      .btn-open {
        background: none;
        border: none;
        border-bottom: 1px solid var(--ink-faint);
        padding: 0 0 1px;
        font-family: inherit;
        font-size: 0.66rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ink-light);
        cursor: pointer;
        white-space: nowrap;
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .btn-open:hover {
        color: var(--ink);
        border-color: var(--ink-mid);
      }

      /*  LIGHTBOX  */
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(253, 251, 247, 0.97);
        backdrop-filter: blur(6px);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
      }
      .lightbox.open {
        opacity: 1;
        pointer-events: all;
      }
      .lb-inner {
        max-width: 90vw;
        max-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }
      .lb-inner img {
        max-width: 88vw;
        max-height: 87vh;
        object-fit: contain;
        display: block;
        box-shadow: 0 4px 40px rgba(28, 23, 16, 0.1);
      }
      .lb-inner iframe {
        width: 88vw;
        height: 84vh;
        border: none;
        background: #fff;
        box-shadow: 0 4px 40px rgba(28, 23, 16, 0.1);
      }
      .lb-close {
        position: fixed;
        top: 22px;
        right: 36px;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-light);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: color 0.2s;
        z-index: 3001;
      }
      .lb-close svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }
      .lb-close:hover {
        color: var(--ink);
      }

      .lb-nav {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: 300;
        color: var(--ink-faint);
        cursor: pointer;
        padding: 20px 24px;
        transition: color 0.2s;
        z-index: 3001;
        line-height: 1;
        letter-spacing: 0;
      }
      .lb-nav:hover {
        color: var(--ink-mid);
      }
      .lb-nav:disabled {
        opacity: 0.15;
        cursor: default;
      }
      .lb-nav.prev {
        left: 4px;
      }
      .lb-nav.next {
        right: 4px;
      }

      .lb-counter {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.64rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
      }

      @media (max-width: 1100px) {
        :root {
          --cols: 3;
        }
      }
      @media (max-width: 800px) {
        :root {
          --cols: 2;
        }
        .int-preview iframe {
          height: 280px;
        }
        .int-caption {
          flex-direction: column;
          gap: 10px;
        }
        .map-section {
          padding: 40px 24px 60px;
        }
        .topbar,
        .section-nav {
          padding-left: 24px;
          padding-right: 24px;
        }
        .section-nav {
          gap: 20px;
          top: 54px;
        }
      }
      @media (max-width: 500px) {
        :root {
          --cols: 2;
        }
        .lb-nav {
          padding: 12px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="#" class="wordmark">Maps</a>
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
        Portfolio
      </a>
    </div>

    <nav class="section-nav">
      <a href="#interactive">Interactive</a>
      <a href="#main">Main</a>
      <a href="#stylized">Stylized</a>
      <a href="#class">Course Work</a>
    </nav>

    <!-- INTERACTIVE -->
    <section class="map-section" id="interactive">
      <div class="section-head">
        <span class="section-title">Interactive</span>
        <span class="section-count">1 map</span>
      </div>
      <div
        class="int-preview"
        id="intPreview"
        role="button"
        tabindex="0"
        aria-label="Open interactive map"
      >
        <iframe
          src="interactive_1.html"
          scrolling="no"
          loading="lazy"
          tabindex="-1"
        ></iframe>
      </div>
      <div class="int-caption" id="intInfo">
        <span class="int-tag">HTML · Interactive</span>
        <p class="int-body">
          Pan, zoom, and explore the data directly in your browser.
        </p>
        <button class="btn-open" id="openInteractive">Open full map</button>
      </div>
    </section>

    <!-- MAIN -->
    <section class="map-section" id="main">
      <div class="section-head">
        <span class="section-title">Main</span>
        <span class="section-count">34 maps</span>
      </div>
      <div class="masonry-wrap" id="main-masonry"></div>
    </section>

    <!-- STYLIZED -->
    <section class="map-section" id="stylized">
      <div class="section-head">
        <span class="section-title">Stylized</span>
        <span class="section-count">15 maps</span>
      </div>
      <div class="masonry-wrap" id="stylized-masonry"></div>
    </section>

    <!-- COURSE WORK -->
    <section class="map-section" id="class">
      <div class="section-head">
        <span class="section-title">Course Work</span>
        <span class="section-count">24 maps</span>
      </div>
      <div class="masonry-wrap" id="class-masonry"></div>
    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
      <button class="lb-close" id="lbClose">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Close
      </button>
      <button class="lb-nav prev" id="lbPrev">←</button>
      <div class="lb-inner" id="lbInner"></div>
      <button class="lb-nav next" id="lbNext">→</button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script>
      const CATALOG = { main: 34, stylized: 15, class: 24 };

      function getNumCols() {
        return (
          parseInt(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--cols")
              .trim(),
          ) || 4
        );
      }

      function buildMasonry(wrapperId, folder, count) {
        const wrap = document.getElementById(wrapperId);
        const numCols = getNumCols();
        const cols = [];

        for (let c = 0; c < numCols; c++) {
          const col = document.createElement("div");
          col.className = "masonry-col";
          wrap.appendChild(col);
          cols.push(col);
        }

        for (let i = 0; i < count; i++) {
          const colIdx = i % numCols;
          const num = i + 1;

          const item = document.createElement("div");
          item.className = "masonry-item";
          item.tabIndex = 0;
          item.setAttribute("role", "button");
          item.setAttribute("aria-label", `View ${folder} map ${num}`);

          const img = document.createElement("img");
          img.alt = `${folder} map ${num}`;
          img.loading = i < numCols * 2 ? "eager" : "lazy";
          img.decoding = "async";
          img.onerror = function () {
            if (this.src.endsWith(".png")) this.src = `${folder}/${num}.jpg`;
          };
          img.src = `${folder}/${num}.png`;

          item.appendChild(img);
          cols[colIdx].appendChild(item);

          const ci = i;
          item.addEventListener("click", () => openLB(folder, ci));
          item.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") openLB(folder, ci);
          });
        }
      }

      buildMasonry("main-masonry", "main", 34);
      buildMasonry("stylized-masonry", "stylized", 15);
      buildMasonry("class-masonry", "class", 24);

      // Lightbox
      const lightbox = document.getElementById("lightbox");
      const lbInner = document.getElementById("lbInner");
      const lbCounter = document.getElementById("lbCounter");
      const lbPrev = document.getElementById("lbPrev");
      const lbNext = document.getElementById("lbNext");
      let lbFolder = null,
        lbIdx = 0,
        lbCount = 0,
        lbIsInt = false;

      function openLB(folder, idx) {
        lbIsInt = false;
        lbFolder = folder;
        lbIdx = idx;
        lbCount = CATALOG[folder];
        lbPrev.style.display = lbNext.style.display = "";
        lbCounter.style.display = "";
        renderLB();
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function openInteractive() {
        lbIsInt = true;
        lbInner.innerHTML = '<iframe src="interactive_1.html"></iframe>';
        lbCounter.textContent = "Interactive Map";
        lbPrev.style.display = lbNext.style.display = "none";
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function renderLB() {
        const num = lbIdx + 1;
        const img = new Image();
        img.onerror = function () {
          if (this.src.endsWith(".png")) this.src = `${lbFolder}/${num}.jpg`;
        };
        img.src = `${lbFolder}/${num}.png`;
        img.alt = `Map ${num}`;
        lbInner.innerHTML = "";
        lbInner.appendChild(img);
        lbCounter.textContent = `${lbFolder} · ${num} / ${lbCount}`;
        lbPrev.disabled = lbIdx === 0;
        lbNext.disabled = lbIdx === lbCount - 1;
      }

      function navigate(dir) {
        const n = lbIdx + dir;
        if (n < 0 || n >= lbCount) return;
        lbIdx = n;
        lbInner.style.opacity = "0";
        setTimeout(() => {
          renderLB();
          lbInner.style.opacity = "1";
        }, 160);
      }

      function closeLB() {
        lightbox.classList.remove("open");
        setTimeout(() => {
          lbInner.innerHTML = "";
        }, 300);
        document.body.style.overflow = "";
      }

      document.getElementById("lbClose").addEventListener("click", closeLB);
      lbPrev.addEventListener("click", () => navigate(-1));
      lbNext.addEventListener("click", () => navigate(1));
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLB();
      });
      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "Escape") closeLB();
        if (e.key === "ArrowLeft" && !lbIsInt) navigate(-1);
        if (e.key === "ArrowRight" && !lbIsInt) navigate(1);
      });

      document
        .getElementById("openInteractive")
        .addEventListener("click", openInteractive);
      document
        .getElementById("intPreview")
        .addEventListener("click", openInteractive);
      document.getElementById("intPreview").addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") openInteractive();
      });

      // Scroll
      const sectionObs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("visible");
              sectionObs.unobserve(e.target);
            }
          });
        },
        { threshold: 0.06 },
      );
      document
        .querySelectorAll(".section-head, .int-preview, .int-caption")
        .forEach((el) => sectionObs.observe(el));

      const itemObs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              const siblings = Array.from(e.target.parentElement.children);
              e.target.style.transitionDelay =
                (siblings.indexOf(e.target) % 5) * 38 + "ms";
              e.target.classList.add("visible");
              itemObs.unobserve(e.target);
            }
          });
        },
        { threshold: 0.04, rootMargin: "0px 0px -24px 0px" },
      );
      document
        .querySelectorAll(".masonry-item")
        .forEach((el) => itemObs.observe(el));
    </script>
  </body>
</html>
