<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maps - Sandesh Bhandari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --cream: #fdfbf7;
        --ink: #1c1710;
        --ink-mid: #4a4235;
        --ink-light: #8a7d6b;
        --ink-faint: #c8bfaa;
        --ink-ghost: #e2dbd0;
        --gap: 7px;
        --cols: 4;
        --max-w: 1200px;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        padding-top: 50px;
      }

      /* TOPBAR */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        z-index: 200;
        background: rgba(253, 251, 247, 0.96);
        border-bottom: 1px solid var(--ink-ghost);
      }
      .back-link {
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-light);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
        z-index: 2;
      }
      .back-link svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        transition: transform 0.2s;
      }
      .back-link:hover {
        color: var(--ink);
      }
      .back-link:hover svg {
        transform: translateX(-3px);
      }
      .wordmark {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--ink);
        z-index: 1;
      }

      /* SECTION NAV */
      .section-nav {
        position: sticky;
        top: 54px;
        z-index: 100;
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 12px 40px;
        background: rgba(253, 251, 247, 0.96);
        border-bottom: 1px solid var(--ink-ghost);
      }
      .section-nav a {
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ink-faint);
        text-decoration: none;
        transition: color 0.2s;
      }
      .section-nav a:hover {
        color: var(--ink-mid);
      }

      /* SECTIONS */
      .map-section {
        padding: 32px 100px 10px;
        border-bottom: 1px solid var(--ink-ghost);
        scroll-margin-top: 110px;
        content-visibility: auto;
        contain-intrinsic-size: 0 600px;
      }
      #interactive {
        content-visibility: visible;
      }
      .map-section:last-child {
        border-bottom: none;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 12px;
        margin: 0 auto 24px;
        max-width: var(--max-w);
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .section-head.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .section-title {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .section-count {
        font-size: 0.7rem;
        color: var(--ink-light);
      }

      /* GALLERY GRID */
      .gallery-grid {
        display: flex;
        gap: var(--gap);
        max-width: var(--max-w);
        margin: 0 auto;
        align-items: flex-start;
      }
      .masonry-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .gallery-item {
        display: block;
        cursor: pointer;
        position: relative;
        opacity: 0;
        transform: translateY(12px);
        border: 1px solid var(--ink-ghost);
        box-shadow: 0 4px 16px rgba(28, 23, 16, 0.04);
        border-radius: 6px;
        padding: 7px;
        background: #fff;
        transition:
          opacity 0.6s ease,
          transform 0.4s ease,
          box-shadow 0.35s ease;
        overflow: hidden;
      }
      .gallery-item.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .gallery-item:hover {
        box-shadow: 0 12px 32px rgba(28, 23, 16, 0.08);
        transform: translateY(-4px);
      }

      /* Shimmer */
      .gallery-item::before {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          var(--ink-ghost) 0%,
          #ede7db 50%,
          var(--ink-ghost) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        z-index: 0;
      }
      .gallery-item.loaded::before {
        display: none;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .img-wrap {
        position: relative;
        display: block;
        width: 100%;
        z-index: 1;
        border-radius: 2px;
        overflow: hidden;
      }

      .img-wrap canvas {
        display: block;
        width: 100%;
        height: auto;
        filter: blur(8px) saturate(0.85);
        transform: scale(1.05);
        transition: opacity 0.5s ease;
      }
      .img-wrap img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.55s ease;
      }
      .img-wrap img.revealed {
        opacity: 1;
      }
      .img-wrap canvas.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .gallery-item:hover .img-wrap img {
        filter: brightness(0.97);
      }

      /* INTERACTIVE */
      .int-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        max-width: var(--max-w);
        margin: 0 auto;
      }
      .int-preview {
        height: 200px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        background: #fff;
        border: 1px solid var(--ink-ghost);
        box-shadow: 0 4px 16px rgba(28, 23, 16, 0.04);
        border-radius: 6px;
        padding: 4px;
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 0.7s ease,
          transform 0.4s ease,
          box-shadow 0.4s ease;
      }
      .int-preview.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .int-preview:hover {
        box-shadow: 0 12px 32px rgba(28, 23, 16, 0.08);
        transform: translateY(-4px);
      }
      .int-preview iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 2px;
        pointer-events: none;
      }

      /* LIGHTBOX */
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(253, 251, 247, 0.98);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .lightbox.open {
        opacity: 1;
        pointer-events: all;
      }
      .lb-inner {
        max-width: 90vw;
        max-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s ease;
      }
      .lb-inner img {
        max-width: 88vw;
        max-height: 87vh;
        object-fit: contain;
        display: block;
      }
      .lb-inner iframe {
        width: 88vw;
        height: 84vh;
        border: none;
        background: #fff;
        box-shadow: 0 4px 40px rgba(28, 23, 16, 0.1);
      }
      .lb-close {
        position: fixed;
        top: 22px;
        right: 36px;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-light);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: color 0.2s;
        z-index: 3001;
      }
      .lb-close svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }
      .lb-close:hover {
        color: var(--ink);
      }
      .lb-nav {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: 300;
        color: var(--ink-faint);
        cursor: pointer;
        padding: 20px 24px;
        transition: color 0.2s;
        z-index: 3001;
        line-height: 1;
      }
      .lb-nav:hover {
        color: var(--ink-mid);
      }
      .lb-nav:disabled {
        opacity: 0.15;
        cursor: default;
      }
      .lb-nav.prev {
        left: 4px;
      }
      .lb-nav.next {
        right: 4px;
      }
      .lb-counter {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.64rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
      }

      @media (max-width: 1100px) {
        :root {
          --cols: 3;
        }
      }
      @media (max-width: 800px) {
        :root {
          --cols: 2;
          --gap: 6px;
        }
        .int-preview {
          height: 150px;
        }
        .map-section {
          padding: 24px 24px 12px;
          scroll-margin-top: 100px;
        }
        .topbar,
        .section-nav {
          padding-left: 24px;
          padding-right: 24px;
        }
        .section-nav {
          gap: 20px;
          top: 54px;
        }
      }
      @media (max-width: 500px) {
        :root {
          --cols: 1;
        }
        .section-nav {
          flex-wrap: wrap;
          gap: 12px;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
        Portfolio
      </a>
      <a href="#" class="wordmark">Maps</a>
    </div>

    <nav class="section-nav">
      <a href="#interactive">Interactive</a>
      <a href="#main">Main</a>
      <a href="#stylized">Stylized</a>
      <a href="#class">Course Work</a>
    </nav>

    <section class="map-section" id="interactive">
      <div class="section-head">
        <span class="section-title">Interactive</span>
        <span class="section-count">2 maps</span>
      </div>
      <div class="int-grid">
        <div
          class="int-preview"
          id="intPreview1"
          data-src="interactive_1.html"
          role="button"
          tabindex="0"
          aria-label="Open interactive map 1"
        >
          <iframe scrolling="no" tabindex="-1"></iframe>
        </div>
        <div
          class="int-preview"
          id="intPreview2"
          data-src="interactive_2.html"
          role="button"
          tabindex="0"
          aria-label="Open interactive map 2"
        >
          <iframe scrolling="no" tabindex="-1"></iframe>
        </div>
      </div>
    </section>

    <section class="map-section" id="main">
      <div class="section-head">
        <span class="section-title">Main</span
        ><span class="section-count" id="count-main">Loading...</span>
      </div>
      <div class="gallery-grid" id="main-masonry"></div>
    </section>

    <section class="map-section" id="stylized">
      <div class="section-head">
        <span class="section-title">Stylized</span
        ><span class="section-count" id="count-stylized">Loading...</span>
      </div>
      <div class="gallery-grid" id="stylized-masonry"></div>
    </section>

    <section class="map-section" id="class">
      <div class="section-head">
        <span class="section-title">Course Work</span
        ><span class="section-count" id="count-class">Loading...</span>
      </div>
      <div class="gallery-grid" id="class-masonry"></div>
    </section>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
      <button class="lb-close" id="lbClose">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Close
      </button>
      <button class="lb-nav prev" id="lbPrev">←</button>
      <div class="lb-inner" id="lbInner"></div>
      <button class="lb-nav next" id="lbNext">→</button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script>
      const CATALOG = { main: 0, stylized: 0, class: 0 };
      const SRC_CACHE = {}; // e.g. 'main/3.webp'
      const PROBE_EXTS = ["webp", "png", "jpg"];

      function getNumCols() {
        return (
          parseInt(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--cols")
              .trim(),
          ) || 4
        );
      }

      function drawPlaceholder(sourceImg, canvas) {
        const W = 20;
        const H = sourceImg.naturalHeight
          ? Math.round((20 * sourceImg.naturalHeight) / sourceImg.naturalWidth)
          : 14;
        canvas.width = W;
        canvas.height = H;
        try {
          canvas.getContext("2d").drawImage(sourceImg, 0, 0, W, H);
        } catch (_) {}
      }

      function loadWithBlurup(item, src) {
        const imgWrap = item.querySelector(".img-wrap");
        const canvas = imgWrap.querySelector("canvas");
        const img = imgWrap.querySelector("img");

        img.src = src;
        img.onload = () => {
          drawPlaceholder(img, canvas);
          const reveal = () => {
            img.classList.add("revealed");
            canvas.classList.add("hidden");
            item.classList.add("loaded");
          };
          img.decode ? img.decode().then(reveal).catch(reveal) : reveal();
        };
        img.onerror = () => item.classList.add("loaded");
      }

      function probeImage(folder, num) {
        return new Promise((resolve) => {
          let extIdx = 0;

          function tryNext() {
            if (extIdx >= PROBE_EXTS.length) {
              resolve(null);
              return;
            }
            const ext = PROBE_EXTS[extIdx++];
            const src = `${folder}/${num}.${ext}`;
            const img = new Image();
            img.onload = () =>
              resolve({
                src,
                num,
                width: img.naturalWidth,
                height: img.naturalHeight,
              });
            img.onerror = tryNext;
            img.src = src;
          }

          tryNext();
        });
      }

      function addItem(result, cols, folder, numCols) {
        const { src, num, width, height } = result;
        const colIdx = (num - 1) % numCols;

        SRC_CACHE[`${folder}-${num}`] = src;
        CATALOG[folder] = Math.max(CATALOG[folder], num);
        document.getElementById(`count-${folder}`).textContent =
          `${CATALOG[folder]} maps`;

        const item = document.createElement("div");
        item.className = "gallery-item";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", `View ${folder} map ${num}`);
        item._src = src;
        item._folder = folder;
        item._num = num;

        const imgWrap = document.createElement("div");
        imgWrap.className = "img-wrap";
        if (width && height) imgWrap.style.aspectRatio = `${width} / ${height}`;

        const canvas = document.createElement("canvas");
        const realImg = document.createElement("img");
        realImg.alt = `${folder} map ${num}`;
        realImg.decoding = "async";

        imgWrap.appendChild(canvas);
        imgWrap.appendChild(realImg);
        item.appendChild(imgWrap);
        cols[colIdx].appendChild(item);

        const idx = num - 1;
        item.addEventListener("click", () => openLB(folder, idx));
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") openLB(folder, idx);
        });

        lazyObs.observe(item);
      }

      async function loadGallery(folder, wrapperId) {
        const wrap = document.getElementById(wrapperId);
        wrap.innerHTML = "";

        const numCols = getNumCols();
        const cols = [];
        for (let c = 0; c < numCols; c++) {
          const col = document.createElement("div");
          col.className = "masonry-col";
          wrap.appendChild(col);
          cols.push(col);
        }

        const BATCH_SIZE = 6;
        let base = 1;
        let running = true;

        while (running) {
          const nums = Array.from({ length: BATCH_SIZE }, (_, k) => base + k);
          const results = await Promise.all(
            nums.map((n) => probeImage(folder, n)),
          );

          for (const result of results) {
            if (!result) {
              running = false;
              break;
            }
            addItem(result, cols, folder, numCols);
          }

          base += BATCH_SIZE;
        }

        if (CATALOG[folder] === 0) {
          document.getElementById(`count-${folder}`).textContent = "0 maps";
        }
      }

      const lazyObs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            lazyObs.unobserve(e.target);
            const item = e.target;
            const siblings = Array.from(item.parentElement.children);
            item.style.transitionDelay =
              (siblings.indexOf(item) % 5) * 40 + "ms";
            item.classList.add("visible");
            loadWithBlurup(item, item._src);
          });
        },
        { threshold: 0.01, rootMargin: "0px 0px 300px 0px" },
      );

      const sectionObs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            e.target.classList.add("visible");
            sectionObs.unobserve(e.target);

            // Inject iframe src only when the preview scrolls into view
            if (e.target.classList.contains("int-preview")) {
              const iframe = e.target.querySelector("iframe");
              const src = e.target.dataset.src;
              if (iframe && src && !iframe.src.endsWith(src)) {
                iframe.src = src;
              }
            }
          });
        },
        { threshold: 0.06 },
      );
      document
        .querySelectorAll(".section-head, .int-preview")
        .forEach((el) => sectionObs.observe(el));

      // Lightbox
      const lightbox = document.getElementById("lightbox");
      const lbInner = document.getElementById("lbInner");
      const lbCounter = document.getElementById("lbCounter");
      const lbPrev = document.getElementById("lbPrev");
      const lbNext = document.getElementById("lbNext");
      let lbFolder = null,
        lbIdx = 0,
        lbCount = 0,
        lbIsInt = false;

      function openLB(folder, idx) {
        lbIsInt = false;
        lbFolder = folder;
        lbIdx = idx;
        lbCount = CATALOG[folder];
        lbPrev.style.display = lbNext.style.display = "";
        renderLB();
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function openInteractive(src, title) {
        lbIsInt = true;
        lbInner.innerHTML = `<iframe src="${src}"></iframe>`;
        lbCounter.textContent = title;
        lbPrev.style.display = lbNext.style.display = "none";
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function renderLB() {
        const num = lbIdx + 1;
        const src =
          SRC_CACHE[`${lbFolder}-${num}`] || `${lbFolder}/${num}.webp`;

        const img = new Image();
        img.alt = `Map ${num}`;
        img.decoding = "async";
        const show = () => {
          lbInner.innerHTML = "";
          lbInner.appendChild(img);
        };
        img.onload = () =>
          img.decode ? img.decode().then(show).catch(show) : show();
        img.onerror = () => {
          if (src.endsWith(".webp")) img.src = src.replace(".webp", ".png");
          else if (src.endsWith(".png")) img.src = src.replace(".png", ".jpg");
        };
        img.src = src;

        lbCounter.textContent = `${lbFolder} · ${num} / ${lbCount}`;
        lbPrev.disabled = lbIdx === 0;
        lbNext.disabled = lbIdx === lbCount - 1;
      }

      function navigate(dir) {
        const n = lbIdx + dir;
        if (n < 0 || n >= lbCount) return;
        lbIdx = n;
        lbInner.style.opacity = "0";
        setTimeout(() => {
          renderLB();
          lbInner.style.opacity = "1";
        }, 160);
      }

      function closeLB() {
        lightbox.classList.remove("open");
        setTimeout(() => {
          lbInner.innerHTML = "";
        }, 300);
        document.body.style.overflow = "";
      }

      document.getElementById("lbClose").addEventListener("click", closeLB);
      lbPrev.addEventListener("click", () => navigate(-1));
      lbNext.addEventListener("click", () => navigate(1));
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLB();
      });
      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "Escape") closeLB();
        if (e.key === "ArrowLeft" && !lbIsInt) navigate(-1);
        if (e.key === "ArrowRight" && !lbIsInt) navigate(1);
      });

      ["intPreview1", "intPreview2"].forEach((id, idx) => {
        const el = document.getElementById(id);
        if (!el) return;
        const src = el.dataset.src;
        const lbl = `Interactive Map ${idx + 1}`;
        el.addEventListener("click", () => openInteractive(src, lbl));
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") openInteractive(src, lbl);
        });
      });

      Promise.all([
        loadGallery("main", "main-masonry"),
        loadGallery("stylized", "stylized-masonry"),
        loadGallery("class", "class-masonry"),
      ]);
    </script>
  </body>
</html>
