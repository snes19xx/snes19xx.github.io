<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>archive</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap");

      :root {
        --bg-color: #fdfbf7;
        --surface: #ffffff;
        --text-main: #292524;
        --text-muted: #78716c;
        --line-color: #d6d3d1;
        --status-finished: #10b981;
        --status-dropped: #ef4444;
        --status-unfinished: #f59e0b;
        --star-fill-top: #ddb84e;
        --star-fill-bottom: #c07e28;
        --star-stroke: #a86820;
        --star-empty: #d6d3d1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.4;
        padding: 4rem 2rem;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        position: relative;
      }

      /* --- NAVIGATION --- */
      .nav__back {
        position: absolute;
        top: 2rem;
        left: 2rem;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition:
          color 0.2s ease,
          transform 0.2s ease;
      }
      .nav__back:hover {
        color: var(--text-main);
        transform: translateX(-4px);
      }

      .nav__viz {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
        text-decoration: none;
        color: #f0fdf9;
        background-color: #4f7942;
        padding: 0.55rem 1.15rem;
        border: 1px solid #2a4023;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 1px 2px rgba(13, 122, 99, 0.2);
        transition:
          color 0.2s ease,
          background-color 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }
      .nav__viz:hover {
        color: #f0fdf9;
        background-color: #0a5f4d;
        border-color: #0a5f4d;
        box-shadow: 0 6px 14px -4px rgba(13, 122, 99, 0.4);
        transform: translateY(-2px);
      }
      .nav__viz:active {
        transform: translateY(0);
        box-shadow: 0 1px 2px rgba(13, 122, 99, 0.25);
      }
      .nav__viz:focus-visible {
        outline: 2px solid var(--star-fill-bottom);
        outline-offset: 3px;
      }

      header {
        text-align: center;
        margin-bottom: 4rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-size: 2.2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      /* --- S-CURVE TIMELINE --- */
      .timeline {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        padding: 0 2rem;
      }

      .year-section {
        position: relative;
        margin-bottom: 4rem;
        display: flex;
        flex-direction: column;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1.1rem;
        width: 85%;
        z-index: 2;
      }

      .year-section:nth-child(odd) {
        align-items: flex-start;
      }
      .year-section:nth-child(even) {
        align-items: flex-end;
      }
      .year-section:nth-child(even) .year-label {
        align-self: flex-end;
      }

      .year-label {
        font-size: 1.5rem;
        font-weight: 300;
        color: var(--text-main);
        margin-bottom: 1.5rem;
        background: var(--bg-color);
        padding: 0.2rem 1rem;
        border: 1px solid var(--line-color);
        border-radius: 2rem;
        display: inline-block;
        z-index: 3;
      }

      .year-section::after {
        content: "";
        position: absolute;
        top: 3rem;
        bottom: -4rem;
        width: 50%;
        border: 2px solid var(--line-color);
        z-index: 0;
      }
      .year-section:nth-child(odd):not(:last-child)::after {
        right: 5%;
        border-left: none;
        border-radius: 0 100px 100px 0;
      }
      .year-section:nth-child(even):not(:last-child)::after {
        left: 5%;
        border-right: none;
        border-radius: 100px 0 0 100px;
      }
      .year-section:last-child::after {
        display: none;
      }

      /* --- CARDS --- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line-color);
        padding: 0.8rem;
        border-radius: 6px;
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        backface-visibility: hidden;
        transform: translateZ(0);
        -webkit-font-smoothing: subpixel-antialiased;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translate3d(0, -2px, 0);
        box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.04);
      }

      /* While anime drives inline transforms, the CSS transition above would
         re-interpolate every frame and smear the motion. */
      .is-revealing {
        transition: none !important;
        will-change: opacity, transform;
      }

      .cover {
        flex-shrink: 0;
        width: 50px;
        height: 75px;
        background-color: #f5f5f4;
        box-shadow: inset 0 0 0 1px var(--line-color);
        border-radius: 3px;
        position: relative;
      }
      .cover::after {
        content: "COVER";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.5rem;
        color: #a8a29e;
        letter-spacing: 1px;
        z-index: 0;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 3px;
        position: relative;
        z-index: 1;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      .info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
      }

      /* --- TYPOGRAPHY --- */
      .book .title {
        font-family: "Lora", serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-style: italic;
        color: var(--text-main);
        margin: 0.2rem 0;
      }
      .game .title {
        font-family: "Inter", sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
        margin: 0.2rem 0;
      }
      .meta {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* --- STATUS --- */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.2rem;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .status.finished::before {
        background-color: var(--status-finished);
      }
      .status.dropped::before {
        background-color: var(--status-dropped);
      }
      .status.unfinished::before {
        background-color: var(--status-unfinished);
      }

      .type-label {
        font-size: 0.6rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* --- STARS --- */
      .stars-row {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 0.5rem;
        opacity: 0.45;
        transition: opacity 0.2s ease;
      }
      .card:hover .stars-row {
        opacity: 0.65;
      }
      .stars-group {
        display: flex;
        align-items: center;
        gap: 1.5px;
      }
      .stars-row svg.star {
        display: block;
      }
      .rating-label {
        font-size: 0.55rem;
        font-weight: 400;
        color: var(--text-muted);
        letter-spacing: 0.02em;
        margin-left: 2px;
        line-height: 1;
      }

      /* --- RESPONSIVE --- */
      @media (max-width: 900px) {
        .nav__back {
          top: 1.5rem;
          left: 1.5rem;
        }
        .grid {
          width: 100%;
        }
        .year-section::after {
          display: none;
        }
        .year-section:nth-child(even) {
          align-items: flex-start;
        }
        .year-section:nth-child(even) .year-label {
          align-self: flex-start;
        }
        .year-section {
          margin-bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="../index.html" class="nav__back">← Back</a>

    <header>
      <h1>Archive</h1>
      <div class="subtitle">
        An ongoing log of books and video games I started in 2021
      </div>
      <a href="visualizations.html" class="nav__viz">Data Trends</a>
    </header>

    <div class="timeline" id="timeline"></div>

    <script src="../anime.min.js"></script>
    <script src="archive.js"></script>
  </body>
</html>
