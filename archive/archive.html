<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>archive</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap");

      :root {
        --bg-color: #fdfbf7;
        --surface: #ffffff;
        --text-main: #292524;
        --text-muted: #78716c;
        --line-color: #d6d3d1;
        --status-finished: #10b981;
        --status-dropped: #ef4444;
        --status-unfinished: #f59e0b;
        --star-fill-top: #ddb84e;
        --star-fill-bottom: #c07e28;
        --star-stroke: #a86820;
        --star-empty: #d6d3d1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.4;
        padding: 4rem 2rem;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        position: relative;
      }

      /* --- NAVIGATION --- */
      .nav__back {
        position: absolute;
        top: 2rem;
        left: 2rem;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition:
          color 0.2s ease,
          transform 0.2s ease;
      }
      .nav__back:hover {
        color: var(--text-main);
        transform: translateX(-4px);
      }

      .nav__viz {
        position: absolute;
        top: 2rem;
        right: 2rem;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: var(--surface);
        background-color: var(--text-main);
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition:
          background-color 0.2s ease,
          transform 0.2s ease;
      }
      .nav__viz:hover {
        background-color: var(--text-muted);
        transform: translateY(-2px);
      }

      header {
        text-align: center;
        margin-bottom: 4rem;
      }
      h1 {
        font-size: 2.2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      /* --- S-CURVE TIMELINE --- */
      .timeline {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        padding: 0 2rem;
      }

      .year-section {
        position: relative;
        margin-bottom: 4rem;
        display: flex;
        flex-direction: column;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1.1rem;
        width: 85%;
        z-index: 2;
      }

      .year-section:nth-child(odd) {
        align-items: flex-start;
      }
      .year-section:nth-child(even) {
        align-items: flex-end;
      }
      .year-section:nth-child(even) .year-label {
        align-self: flex-end;
      }

      .year-label {
        font-size: 1.5rem;
        font-weight: 300;
        color: var(--text-main);
        margin-bottom: 1.5rem;
        background: var(--bg-color);
        padding: 0.2rem 1rem;
        border: 1px solid var(--line-color);
        border-radius: 2rem;
        display: inline-block;
        z-index: 3;
      }

      .year-section::after {
        content: "";
        position: absolute;
        top: 3rem;
        bottom: -4rem;
        width: 50%;
        border: 2px solid var(--line-color);
        z-index: 0;
      }
      .year-section:nth-child(odd):not(:last-child)::after {
        right: 5%;
        border-left: none;
        border-radius: 0 100px 100px 0;
      }
      .year-section:nth-child(even):not(:last-child)::after {
        left: 5%;
        border-right: none;
        border-radius: 100px 0 0 100px;
      }
      .year-section:last-child::after {
        display: none;
      }

      /* --- CARDS --- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line-color);
        padding: 0.8rem;
        border-radius: 6px;
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        backface-visibility: hidden;
        transform: translateZ(0);
        -webkit-font-smoothing: subpixel-antialiased;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translate3d(0, -2px, 0);
        box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.04);
      }

      .cover {
        flex-shrink: 0;
        width: 50px;
        height: 75px;
        background-color: #f5f5f4;
        box-shadow: inset 0 0 0 1px var(--line-color);
        border-radius: 3px;
        position: relative;
      }
      .cover::after {
        content: "COVER";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.5rem;
        color: #a8a29e;
        letter-spacing: 1px;
        z-index: 0;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 3px;
        position: relative;
        z-index: 1;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      .info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
      }

      /* --- TYPOGRAPHY --- */
      .book .title {
        font-family: "Lora", serif;
        font-size: 0.95rem;
        font-weight: 500;
        font-style: italic;
        color: var(--text-main);
        margin: 0.2rem 0;
      }
      .game .title {
        font-family: "Inter", sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
        margin: 0.2rem 0;
      }
      .meta {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* --- STATUS --- */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.2rem;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .status.finished::before {
        background-color: var(--status-finished);
      }
      .status.dropped::before {
        background-color: var(--status-dropped);
      }
      .status.unfinished::before {
        background-color: var(--status-unfinished);
      }

      .type-label {
        font-size: 0.6rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* --- STARS --- */
      .stars-row {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 0.5rem;
        opacity: 0.45;
        transition: opacity 0.2s ease;
      }
      .card:hover .stars-row {
        opacity: 0.65;
      }
      .stars-group {
        display: flex;
        align-items: center;
        gap: 1.5px;
      }
      .stars-row svg.star {
        display: block;
      }
      .rating-label {
        font-size: 0.55rem;
        font-weight: 400;
        color: var(--text-muted);
        letter-spacing: 0.02em;
        margin-left: 2px;
        line-height: 1;
      }

      /* --- RESPONSIVE --- */
      @media (max-width: 900px) {
        .nav__back {
          top: 1.5rem;
          left: 1.5rem;
        }
        .nav__viz {
          top: 1.5rem;
          right: 1.5rem;
        }
        .grid {
          width: 100%;
        }
        .year-section::after {
          display: none;
        }
        .year-section:nth-child(even) {
          align-items: flex-start;
        }
        .year-section:nth-child(even) .year-label {
          align-self: flex-start;
        }
        .year-section {
          margin-bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="../index.html" class="nav__back">← Back</a>
    <a href="visualizations.html" class="nav__viz">Data Trends →</a>

    <header>
      <h1>Archive</h1>
      <div class="subtitle">
        An ongoing log of books and video games I started in 2021
      </div>
    </header>

    <div class="timeline" id="timeline"></div>

    <script>
      // --- Stars ---
      let _uid = 0;
      const STAR_PTS =
        "10,1 12.2,6.9 18.6,7.2 13.6,11.2 15.3,17.3 10,13.8 4.7,17.3 6.4,11.2 1.4,7.2 7.8,6.9";
      const NS = "http://www.w3.org/2000/svg";

      function el(tag, attrs = {}) {
        const e = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        return e;
      }

      function makeStar(fillType, uid) {
        const svg = el("svg", {
          viewBox: "0 0 20 20",
          width: "9",
          height: "9",
          "aria-hidden": "true",
        });
        svg.classList.add("star");

        if (fillType === "empty") {
          svg.appendChild(
            el("polygon", {
              points: STAR_PTS,
              fill: "#f5f4f1",
              stroke: "#ccc8c4",
              "stroke-width": "1.2",
              "stroke-linejoin": "round",
            }),
          );
        } else if (fillType === "full") {
          svg.classList.add("filled");
          const defs = el("defs");
          const grad = el("linearGradient", {
            id: `sg-${uid}`,
            x1: "0%",
            y1: "0%",
            x2: "0%",
            y2: "100%",
          });
          grad.append(
            el("stop", { offset: "0%", "stop-color": "#e8c060" }),
            el("stop", { offset: "100%", "stop-color": "#c07428" }),
          );
          defs.append(grad);
          svg.append(defs);
          svg.appendChild(
            el("polygon", {
              points: STAR_PTS,
              fill: `url(#sg-${uid})`,
              stroke: "#a8661a",
              "stroke-width": "0.6",
              "stroke-linejoin": "round",
            }),
          );
        } else if (fillType === "half") {
          svg.classList.add("filled");
          const defs = el("defs");
          const grad = el("linearGradient", {
            id: `sg-${uid}`,
            x1: "0%",
            y1: "0%",
            x2: "0%",
            y2: "100%",
          });
          grad.append(
            el("stop", { offset: "0%", "stop-color": "#e8c060" }),
            el("stop", { offset: "100%", "stop-color": "#c07428" }),
          );
          const clipL = el("clipPath", { id: `cl-${uid}` });
          clipL.appendChild(
            el("rect", { x: "0", y: "0", width: "10", height: "20" }),
          );
          const clipR = el("clipPath", { id: `cr-${uid}` });
          clipR.appendChild(
            el("rect", { x: "10", y: "0", width: "10", height: "20" }),
          );
          defs.append(grad, clipL, clipR);
          svg.append(defs);
          svg.append(
            el("polygon", {
              points: STAR_PTS,
              fill: "#f5f4f1",
              stroke: "#ccc8c4",
              "stroke-width": "1.2",
              "stroke-linejoin": "round",
              "clip-path": `url(#cr-${uid})`,
            }),
            el("polygon", {
              points: STAR_PTS,
              fill: `url(#sg-${uid})`,
              "clip-path": `url(#cl-${uid})`,
              stroke: "none",
            }),
            el("polygon", {
              points: STAR_PTS,
              fill: "none",
              stroke: "#a8661a",
              "stroke-width": "0.6",
              "stroke-linejoin": "round",
              "clip-path": `url(#cl-${uid})`,
            }),
          );
        }
        return svg;
      }

      function buildStars(rating) {
        const row = document.createElement("div");
        row.className = "stars-row";
        const group = document.createElement("div");
        group.className = "stars-group";
        for (let i = 1; i <= 5; i++) {
          const fill = rating - (i - 1);
          _uid++;
          group.appendChild(
            makeStar(fill >= 1 ? "full" : fill >= 0.5 ? "half" : "empty", _uid),
          );
        }
        row.append(group);
        return row;
      }

      // --- Card rendering from data.json ---
      function buildCard(item) {
        const card = document.createElement("div");
        card.className = `card ${item.type.toLowerCase()}`;
        card.dataset.rating = item.rating;

        const cover = document.createElement("div");
        cover.className = "cover";
        const img = document.createElement("img");
        img.src = item.cover;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        cover.appendChild(img);

        const info = document.createElement("div");
        info.className = "info";

        const statusBar = document.createElement("div");
        statusBar.className = "status-bar";
        const status = document.createElement("span");
        status.className = `status ${item.status.toLowerCase()}`;
        status.textContent = item.status;
        const typeLabel = document.createElement("span");
        typeLabel.className = "type-label";
        typeLabel.textContent = item.type;
        statusBar.append(status, typeLabel);

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = item.title;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = item.creator;

        info.append(statusBar, title, meta, buildStars(item.rating));
        card.append(cover, info);
        return card;
      }

      function render(data) {
        const timeline = document.getElementById("timeline");
        const years = [...new Set(data.map((d) => d.year))].sort(
          (a, b) => b - a,
        );
        years.forEach((year) => {
          const section = document.createElement("div");
          section.className = "year-section";
          const label = document.createElement("div");
          label.className = "year-label";
          label.textContent = year;
          const grid = document.createElement("div");
          grid.className = "grid";
          data
            .filter((d) => d.year === year)
            .forEach((item) => grid.appendChild(buildCard(item)));
          section.append(label, grid);
          timeline.appendChild(section);
        });
      }

      fetch("data.json")
        .then((r) => r.json())
        .then(render)
        .catch((err) => {
          console.error("Failed to load archive data:", err);
          document.getElementById("timeline").innerHTML =
            '<p style="text-align:center;color:var(--text-muted)">Could not load archive data.</p>';
        });
    </script>
  </body>
</html>
