<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizations</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap");

      :root {
        --bg-color: #fdfbf7;
        --surface: #ffffff;
        --text-main: #292524;
        --text-muted: #78716c;
        --line-color: #d6d3d1;
        --status-finished: #10b981;
        --status-dropped: #ef4444;
        --status-unfinished: #f59e0b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.4;
        padding: 4rem 2rem 6rem;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .nav__back {
        position: absolute;
        top: 2rem;
        left: 2rem;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition:
          color 0.2s ease,
          transform 0.2s ease;
      }
      .nav__back:hover {
        color: var(--text-main);
        transform: translateX(-4px);
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }
      h1 {
        font-size: 2.2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      .controls {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-bottom: 3rem;
        z-index: 10;
        position: relative;
      }

      .legend {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 1.2rem;
        width: 100%;
        max-width: 1200px;
        margin: 1.2rem auto 0;
      }
      .legend__item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.65rem;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .legend__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .legend__dot.finished {
        background-color: var(--status-finished);
      }
      .legend__dot.unfinished {
        background-color: var(--status-unfinished);
      }
      .legend__dot.dropped {
        background-color: var(--status-dropped);
      }

      button {
        background: var(--surface);
        border: 1px solid var(--line-color);
        padding: 0.5rem 1.2rem;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        border-color: var(--text-main);
        color: var(--text-main);
      }
      button.active {
        background: var(--text-main);
        color: var(--surface);
        border-color: var(--text-main);
      }

      #viz-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
      }
      #viz-container svg {
        display: block;
      }

      .tooltip {
        position: absolute;
        background: var(--surface);
        border: 1px solid var(--line-color);
        padding: 1rem;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
        z-index: 100;
        min-width: 190px;
      }
      .tooltip .meta-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .tooltip .status {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .tooltip .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .tooltip .status.finished::before {
        background-color: var(--status-finished);
      }
      .tooltip .status.dropped::before {
        background-color: var(--status-dropped);
      }
      .tooltip .status.unfinished::before {
        background-color: var(--status-unfinished);
      }
      .tooltip .yr {
        font-size: 0.65rem;
        color: var(--text-muted);
        font-weight: 600;
      }
      .tooltip .ttitle {
        color: var(--text-main);
        margin-bottom: 0.2rem;
      }
      .tooltip.book .ttitle {
        font-family: "Lora", serif;
        font-size: 1rem;
        font-weight: 500;
        font-style: italic;
      }
      .tooltip.game .ttitle {
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .tooltip .creator {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .tooltip .rating-row {
        display: flex;
        align-items: center;
        gap: 1px;
        margin-top: 0.5rem;
      }
      .tooltip .star-t {
        font-size: 0.75rem;
        color: #c09030;
        line-height: 1;
      }
      .tooltip .star-t.empty {
        color: #d6d3d1;
      }
      .tooltip .rating-num {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-left: 4px;
      }

      .node {
        stroke: var(--surface);
        stroke-width: 2px;
        cursor: pointer;
        transition: opacity 0.6s ease;
      }

      .creator-label {
        font-family: "Inter", sans-serif;
        font-size: 0.68rem;
        font-weight: 500;
        fill: var(--text-main);
        pointer-events: none;
      }
      .creator-count {
        font-family: "Inter", sans-serif;
        font-size: 0.6rem;
        font-weight: 600;
        fill: var(--text-muted);
        pointer-events: none;
      }

      .axis-label {
        font-family: "Inter", sans-serif;
        font-size: 0.65rem;
        font-weight: 500;
        fill: var(--text-muted);
        pointer-events: none;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .group-label {
        font-family: "Inter", sans-serif;
        font-size: 0.72rem;
        font-weight: 500;
        fill: var(--text-muted);
        text-anchor: middle;
        pointer-events: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .row-label {
        font-family: "Inter", sans-serif;
        font-size: 0.65rem;
        font-weight: 600;
        fill: var(--text-muted);
        pointer-events: none;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <a href="archive.html" class="nav__back">← Back</a>

    <header>
      <h1>Trends</h1>
      <div class="subtitle">in ~six years of the archive</div>
    </header>

    <div class="controls">
      <button class="active" data-mode="year">Timeline</button>
      <button data-mode="type">By Medium</button>
      <button data-mode="status">By Status</button>
      <button data-mode="creator">By Author</button>
      <button data-mode="rating">By Stars</button>
      <button data-mode="distribution">Distribution</button>
      <button data-mode="scatter">Stars × Year</button>
    </div>

    <div id="viz-container">
      <div id="tooltip" class="tooltip"></div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <span class="legend__item"
        ><span class="legend__dot finished"></span>Finished</span
      >
      <span class="legend__item"
        ><span class="legend__dot unfinished"></span>Unfinished</span
      >
      <span class="legend__item"
        ><span class="legend__dot dropped"></span>Dropped</span
      >
    </div>

    <script src="visualizations.js"></script>
  </body>
</html>
