<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
    <style>
      :root {
        --bg-color: #fdfbf7;
        --surface: #ffffff;
        --text-main: #292524;
        --text-muted: #78716c;
        --line-color: #d6d3d1;
        --status-finished: #10b981;
        --status-dropped: #ef4444;
        --status-unfinished: #f59e0b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.4;
        padding: 4rem 2rem 6rem;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .nav__back {
        position: absolute;
        top: 2rem;
        left: 2rem;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition:
          color 0.2s ease,
          transform 0.2s ease;
      }
      .nav__back:hover {
        color: var(--text-main);
        transform: translateX(-4px);
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }
      h1 {
        font-size: 2.2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      .controls {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-bottom: 3rem;
        z-index: 10;
        position: relative;
      }

      .legend {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 1.2rem;
        width: 100%;
        max-width: 1200px;
        margin: 1.2rem auto 0;
      }
      .legend__item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: none;
        border: none;
        padding: 0;
        font-family: "Inter", sans-serif;
        font-size: 0.65rem;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        cursor: pointer;
        opacity: 1;
        transition:
          opacity 0.25s ease,
          color 0.25s ease;
      }
      .legend__item[aria-pressed="true"] {
        color: var(--text-main);
      }
      .legend__item.is-muted {
        opacity: 0.35;
      }
      .legend__item:focus-visible {
        outline: 2px solid var(--line-color);
        outline-offset: 4px;
        border-radius: 2px;
      }
      .legend__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .legend__dot.finished {
        background-color: var(--status-finished);
      }
      .legend__dot.unfinished {
        background-color: var(--status-unfinished);
      }
      .legend__dot.dropped {
        background-color: var(--status-dropped);
      }

      .controls button {
        background: var(--surface);
        border: 1px solid var(--line-color);
        padding: 0.5rem 1.2rem;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .controls button.active {
        background: var(--text-main);
        color: var(--surface);
        border-color: var(--text-main);
      }
      @media (hover: hover) {
        .controls button:hover {
          border-color: var(--text-main);
        }
      }

      #viz-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
      }
      #viz-container svg {
        display: block;
      }

      .tooltip {
        position: absolute;
        background: var(--surface);
        border: 1px solid var(--line-color);
        padding: 1rem;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
        z-index: 100;
        min-width: 190px;
        max-width: min(280px, 80vw);
      }
      .tooltip .tt-body {
        display: flex;
        gap: 0.7rem;
        align-items: flex-start;
      }
      .tooltip .tt-cover {
        flex-shrink: 0;
        width: 40px;
        height: 60px;
        object-fit: cover;
        border-radius: 3px;
        background-color: #f5f5f4;
        box-shadow: inset 0 0 0 1px var(--line-color);
      }
      .tooltip .tt-text {
        min-width: 0;
      }
      .tooltip .meta-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .tooltip .status {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .tooltip .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .tooltip .status.finished::before {
        background-color: var(--status-finished);
      }
      .tooltip .status.dropped::before {
        background-color: var(--status-dropped);
      }
      .tooltip .status.unfinished::before {
        background-color: var(--status-unfinished);
      }
      .tooltip .yr {
        font-size: 0.65rem;
        color: var(--text-muted);
        font-weight: 600;
      }
      .tooltip .ttitle {
        color: var(--text-main);
        margin-bottom: 0.2rem;
      }
      .tooltip.book .ttitle {
        font-family: "Lora", serif;
        font-size: 1rem;
        font-weight: 500;
        font-style: italic;
      }
      .tooltip.game .ttitle {
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .tooltip .creator {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .tooltip .rating-row {
        display: flex;
        align-items: center;
        gap: 1px;
        margin-top: 0.5rem;
      }
      .tooltip .star-t {
        font-size: 0.75rem;
        color: #c09030;
        line-height: 1;
      }
      .tooltip .star-t.empty {
        color: #d6d3d1;
      }
      .tooltip .rating-num {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-left: 4px;
      }

      .node {
        stroke: var(--surface);
        stroke-width: 2px;
        cursor: pointer;
        transition: opacity 0.6s ease;
      }

      .creator-label {
        font-family: "Inter", sans-serif;
        font-size: 0.68rem;
        font-weight: 500;
        fill: var(--text-main);
        pointer-events: none;
      }
      .creator-count {
        font-family: "Inter", sans-serif;
        font-size: 0.6rem;
        font-weight: 600;
        fill: var(--text-muted);
        pointer-events: none;
      }

      .axis-label {
        font-family: "Inter", sans-serif;
        font-size: 0.65rem;
        font-weight: 500;
        fill: var(--text-muted);
        pointer-events: none;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .group-label {
        font-family: "Inter", sans-serif;
        font-size: 0.72rem;
        font-weight: 500;
        fill: var(--text-muted);
        text-anchor: middle;
        pointer-events: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .row-label {
        font-family: "Inter", sans-serif;
        font-size: 0.65rem;
        font-weight: 600;
        fill: var(--text-muted);
        pointer-events: none;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* Summary mode */
      .stat-value {
        font-family: "Inter", sans-serif;
        font-size: 1.6rem;
        font-weight: 300;
        fill: var(--text-main);
        letter-spacing: -0.02em;
        pointer-events: none;
      }
      .stat-note {
        font-family: "Inter", sans-serif;
        font-size: 0.6rem;
        font-weight: 500;
        fill: var(--text-muted);
        letter-spacing: 0.04em;
        pointer-events: none;
      }

      /* Phone layout */
      @media (max-width: 820px) {
        body {
          padding: 3.5rem 1rem 3rem;
        }
        .nav__back {
          top: 1.25rem;
          left: 1.25rem;
        }
        header {
          margin-bottom: 1.5rem;
        }
        h1 {
          font-size: 1.75rem;
        }
        .subtitle {
          font-size: 0.78rem;
        }
        .controls {
          flex-wrap: nowrap;
          justify-content: flex-start;
          overflow-x: auto;
          scroll-snap-type: x proximity;
          gap: 0.4rem;
          margin: 0 -1rem 1.75rem;
          padding: 0 1rem 0.5rem;
          scrollbar-width: none;
        }
        .controls::-webkit-scrollbar {
          display: none;
        }
        .controls button {
          flex: 0 0 auto;
          scroll-snap-align: center;
          padding: 0.45rem 0.9rem;
          font-size: 0.7rem;
        }
        .legend {
          justify-content: center;
          gap: 1rem;
          margin-top: 1rem;
        }
        .tooltip {
          padding: 0.7rem;
          min-width: 0;
        }
        .tooltip .tt-cover {
          width: 32px;
          height: 48px;
        }
      }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <a href="archive.html" class="nav__back">← Back</a>

    <header>
      <h1>Trends</h1>
      <div class="subtitle">in ~six years of the archive</div>
    </header>

    <div class="controls">
      <button class="active" data-mode="year">Timeline</button>
      <button data-mode="type">By Medium</button>
      <button data-mode="status">By Status</button>
      <button data-mode="creator">By Author</button>
      <button data-mode="rating">By Stars</button>
      <button data-mode="distribution">Distribution</button>
      <button data-mode="scatter">Stars × Year</button>
      <button data-mode="summary">Summary</button>
    </div>

    <div id="viz-container">
      <div id="tooltip" class="tooltip"></div>
    </div>

    <!-- Legend doubles as filter -->
    <div class="legend">
      <button
        class="legend__item"
        type="button"
        data-status="Finished"
        aria-pressed="false"
      >
        <span class="legend__dot finished"></span>Finished
      </button>
      <button
        class="legend__item"
        type="button"
        data-status="Unfinished"
        aria-pressed="false"
      >
        <span class="legend__dot unfinished"></span>Unfinished
      </button>
      <button
        class="legend__item"
        type="button"
        data-status="Dropped"
        aria-pressed="false"
      >
        <span class="legend__dot dropped"></span>Dropped
      </button>
    </div>

    <script src="visualizations.js"></script>
  </body>
</html>
